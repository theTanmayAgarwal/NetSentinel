# HPE ArubaOS-CX Enterprise Switch Configuration
# Hostname: aruba-core-sw01
# Platform: ArubaOS-CX 10.12.0001
hostname aruba-core-sw01
user admin group administrators password plaintext c3VwZXJzZWNyZXQ=

banner motd "Authorized Access Only - Network Security Policy Enforced"

ssh server vrf default
ssh server cipher aes256-ctr aes192-ctr
ssh server port 22
no ssh server vty-0-4 telnet

aaa authentication login default local
aaa authorization exec default local

snmp-server community public operator
snmp-server v3 user admin auth sha priv aes

logging 192.168.10.50 severity info
logging facility local7

password-policy min-length 12

interface 1/1/1
    description Core-Uplink
    no shutdown
    ip address 10.0.1.1/24

interface vlan 1
    description Management-VLAN
    ip address 192.168.10.1/24

session-timeout 900
