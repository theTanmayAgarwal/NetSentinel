# Sanitized demo configuration - "other/unknown" vendor.
# Used to demonstrate the interactive learning loop: the deterministic parsers
# (tuned to Cisco IOS / Junos set / FortiOS) do NOT recognize these lines, so
# they surface as UNKNOWN and can be taught, then generalized (see Training Center).
# Contains NO real credentials, addresses, or production data.
management telnet server enabled
management ssh server protocol version 2
management http-server enabled
username admin role network-admin secret sha512 SANITIZED-DEMO
snmp-server community public ro
system login-timeout 60
logging host 203.0.113.5
