# Sanitized demo configuration - Fortinet FortiGate (FortiOS)
# Contains NO real credentials, addresses, or production data.
config system global
    set hostname "FGT-DC-03"
    set admintimeout 480
    set admin-http enable
end
config system interface
    edit "port1"
        set ip 192.0.2.20 255.255.255.0
        set allowaccess ping https ssh telnet http
    next
end
config system admin
    edit "admin"
        set accprofile "super_admin"
        set password ENC SANITIZED_FAKE_HASH_PLACEHOLDER
    next
end
config system snmp community
    edit 1
        set name "public"
        set status enable
    next
end
config log syslogd setting
    set status disable
end
