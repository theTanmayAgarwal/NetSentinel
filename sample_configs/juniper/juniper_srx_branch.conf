## Real-World Juniper JunOS SRX340 Branch Security Gateway Configuration (Sanitized)
## JunOS 19.4R3-S1.3

set version 19.4R3-S1.3
set system host-name srx340-branch-01
set system domain-name branch.enterprise.com
set system time-zone UTC

## Authentication & Login Security Controls
set system root-authentication encrypted-password "$6$vB5x$REDACTED_PASSWORD_HASH"
set system login class admin-class idle-timeout 10
set system login user admin class admin-class authentication encrypted-password "$6$k8Lp$REDACTED_HASH"

## System Services & Protocols
set system services ssh protocol-version v2
set system services ssh connection-limit 5
set system services ssh rate-limit 3
set system services telnet disable
set system services web-management http disable
set system services web-management https system-generated-certificate
set system services web-management https interface ge-0/0/0.0

## Remote Syslog & NTP Security Controls
set system syslog host 192.0.2.200 any notice
set system syslog host 192.0.2.200 facility-override local7
set system ntp server 192.0.2.123 prefer

## Interfaces
set interfaces ge-0/0/0 unit 0 family inet address 198.51.100.25/29
set interfaces ge-0/0/1 unit 0 family inet address 10.20.0.1/24

## Security Zones & Policies
set security zones security-zone trust interfaces ge-0/0/1.0 host-inbound-traffic system-services ssh
set security zones security-zone trust interfaces ge-0/0/1.0 host-inbound-traffic system-services https
set security zones security-zone untrust interfaces ge-0/0/0.0
