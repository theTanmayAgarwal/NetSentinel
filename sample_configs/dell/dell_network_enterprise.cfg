! Dell OS10 Enterprise Switch Configuration
! Hostname: dell-s5248-sw01
! Platform: Dell Networking OS10.5.4
hostname dell-s5248-sw01

username admin password 8 $1$9812$s0mehashedpass privilege 15
security-password min-length 14

ip ssh server enable
ip ssh version 2
no ip telnet server enable

ip name-server 10.0.0.2
ntp server 10.0.0.100

snmp-server community secret-ro ro
snmp-server enable traps

logging server 192.168.20.100 severity informational

system-cli-timeout 600

interface ethernet 1/1/1
 description Spine-Uplink
 no shutdown
 switchport mode trunk
!
interface vlan 100
 description Management-VLAN
 ip address 192.168.20.5/24
!
