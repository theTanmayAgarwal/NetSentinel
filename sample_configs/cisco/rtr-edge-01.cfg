!
! Sanitized demo configuration - Cisco IOS
! Contains NO real credentials, addresses, or production data.
! Example addresses use RFC 5737 ranges; secrets are obvious placeholders.
!
hostname RTR-EDGE-01
!
enable secret 5 $1$demo$SANITIZEDdemoHASHplaceholder
!
no service password-encryption
!
aaa new-model
!
username netadmin privilege 15 password 0 CHANGEME-DEMO
!
ip domain-name lab.example.net
ip ssh version 2
!
interface GigabitEthernet0/0
 description UPLINK-TO-CORE
 ip address 192.0.2.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/1
 description UNUSED
 no ip address
!
line con 0
 exec-timeout 0 0
!
line vty 0 4
 exec-timeout 30 0
 transport input telnet ssh
 login local
!
snmp-server community public RO
!
ip http server
no ip http secure-server
!
banner motd ^C Authorized access only. ^C
!
end
