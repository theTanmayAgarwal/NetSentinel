# Real-World Fortinet FortiGate 500E Next-Gen Firewall Configuration (Sanitized)
# FortiOS v6.4.8 build1912

config system global
    set hostname "fgt500e-hq-dc"
    set admin-sport 8443
    set admin-ssh-port 2222
    set admin-scp disable
    set admin-idle-timeout 10
    set admintimeout 10
    set strong-crypto enable
end

config system console
    set mode line
    set output serial
    set login-display enable
end

config system admin
    edit "sec-admin"
        set remote-auth enable
        set accprofile "super_admin"
        set vdom "root"
        set password REDACTED_HASH
    next
end

config system interface
    edit "port1"
        set vdom "root"
        set ip 198.51.100.2 255.255.255.248
        set allowaccess ping ssh
        set type physical
        set snmp-index 1
    next
    edit "port2"
        set vdom "root"
        set ip 10.100.0.1 255.255.255.0
        set allowaccess ping https ssh
        set type physical
        set snmp-index 2
    next
end

config system syslog-accounting
    set mode udp
    set server-ip 192.0.2.100
    set server-port 514
    set status enable
end

config system ntp
    set settime enable
    set ntpserver "192.0.2.123"
end
