: Real-World Cisco ASA 5555 Next-Gen Firewall Configuration (Sanitized)
: ASA Version 9.8(4)
:
ASA-DC01-FW# show running-config
!
hostname ASA-DC01-FW
domain-name datacenter.internal
!
enable password REDACTED_HASH encrypted
!
passwd REDACTED_HASH encrypted
!
interface GigabitEthernet0/0
 nameif outside
 security-level 0
 ip address 203.0.113.10 255.255.255.240
!
interface GigabitEthernet0/1
 nameif inside
 security-level 100
 ip address 172.16.10.1 255.255.255.0
!
interface Management0/0
 nameif mgmt
 security-level 100
 ip address 192.168.100.1 255.255.255.0
!
ssh 192.168.100.0 255.255.255.0 mgmt
ssh version 2
ssh timeout 10
!
no http server enable
http 192.168.100.0 255.255.255.0 mgmt
!
logging enable
logging timestamp
logging host mgmt 192.168.100.50
!
snmp-server host mgmt 192.168.100.55 community REDACTED_SNMP
!
console timeout 10
!
end
