! Real-World Cisco IOS Enterprise Border Router Configuration (Sanitized)
! Version 15.6(3)M2
!
version 15.6
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname rtr-border-dc01
!
boot-start-marker
boot-end-marker
!
security passwords min-length 12
enable secret 5 $1$mER7$8/A0c.8p69cE5w/REDACTED
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
ip domain name enterprise.net
ip name-server 192.0.2.10
ip name-server 192.0.2.11
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
no ip http server
ip http secure-server
!
interface GigabitEthernet0/0
 description ## OUTSIDE WAN INTERFACE ##
 ip address 203.0.113.1 255.255.255.248
 ip access-group WAN_INBOUND in
 duplex auto
 speed auto
!
interface GigabitEthernet0/1
 description ## INSIDE CORE LAN ##
 ip address 10.10.1.1 255.255.255.0
 duplex auto
 speed auto
!
ip access-list extended WAN_INBOUND
 permit tcp any host 203.0.113.1 eq 443
 deny ip any any log
!
logging host 192.0.2.50
logging trap informational
ntp server 192.0.2.123
!
line con 0
 exec-timeout 10 0
 stopbits 1
line vty 0 4
 transport input ssh
 exec-timeout 10 0
 login authentication default
line vty 5 15
 transport input ssh
 exec-timeout 10 0
 login authentication default
!
end
